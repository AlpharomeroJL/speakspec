[project]
name = "speakspec-sidecar"
version = "1.0.0"
description = "Speakspec AI inference sidecar: ASR (faster-whisper) + three-stage Ollama pipeline."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.2",
    "pydantic>=2.13",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["ruff>=0.15", "pytest>=9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B"]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
